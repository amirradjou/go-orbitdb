name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # staticcheck and govulncheck need a current toolchain to build;
          # the test job below still exercises the go.mod floor.
          go-version: stable

      - name: Verify module checksums
        run: go mod verify

      - name: go mod tidy must be a no-op
        run: go mod tidy -diff

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags interop ./interop/

      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    # PowerShell splits -coverprofile=coverage.out at the dot, so use bash on
    # every OS (Git Bash on Windows).
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # go.mod floor (go-ipld-prime and go-libp2p require 1.25.7).
        go-version: ['1.25']
        include:
          - os: ubuntu-latest
            go-version: stable
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build -v ./...

      - name: Test (race detector)
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      # Replication tests run real libp2p hosts; repeat them so a flaky
      # timing assumption shows up here rather than in someone's PR.
      - name: Repeat networking tests
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        run: go test -race -count=5 . ./syncutils/ ./databases/ ./ipfs/

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-go${{ matrix.go-version }}
          path: coverage.out

  interop:
    name: Interop (@orbitdb/core 4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            interop/js-peer/package-lock.json
            tools/jsvectors/package-lock.json

      - name: Install the JavaScript peer
        working-directory: interop/js-peer
        run: npm ci

      - name: Go <-> JS replication
        env:
          ORBITDB_INTEROP_REQUIRED: "1"
        run: go test -tags interop -race -count=1 -v ./interop/

      - name: Install the vector generator
        working-directory: tools/jsvectors
        run: npm ci

      - name: Golden vectors match @orbitdb/core
        working-directory: tools/jsvectors
        run: npm run check
